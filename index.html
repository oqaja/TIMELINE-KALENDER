<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Produksi Konten — Shoe Police</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="app-css">
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#111; --muted:#777; --line:#e3e1da;
  --accent:#111; --today:#ffd400;
  --c-carousel:#2f6bff; --c-short:#ff4d2e; --c-long:#12a150; --c-story:#9b3dff;
  --head:'Futura','Futura PT','Century Gothic','Plus Jakarta Sans',sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:1340px;margin:0 auto;padding:16px}
.main{display:flex;gap:14px;align-items:flex-start}
.main .grid{flex:1;min-width:0}
.side{width:220px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;position:sticky;top:12px}
.side h4{font-family:var(--head);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:2px 6px 2px}
.side .sub2{font-size:11px;color:var(--muted);margin:0 6px 8px}
.bi{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:9px;font-size:13px;font-weight:600}
.bi.brand{cursor:pointer}
.bi.brand:hover{background:#f3f2ee}
.bi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .count{font-weight:600}
.bi .ed{font-size:11px;color:var(--muted);opacity:0}
.bi.brand:hover .ed{opacity:1}
.side .none{font-size:13px;color:var(--muted);padding:4px 6px}
@media(max-width:900px){.main{flex-direction:column;align-items:stretch}.side{width:100%;position:static}.bi .ed{opacity:1}}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.5px;margin:0;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.nav{display:flex;align-items:center;gap:6px}
.nav .month{font-family:var(--head);font-weight:700;font-size:18px;min-width:170px;text-align:center;text-transform:uppercase}
button{font-family:var(--body);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
button:hover{border-color:#bbb}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:#c62828;border-color:#f1c4c4}
.icon{padding:8px 11px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip-f{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chip-f.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.count{color:var(--muted);font-weight:500}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
#syncBtn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dow{background:#111;color:#fff;font-family:var(--head);font-size:12px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:1px}
.day{background:var(--card);min-height:104px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:#fafaf7}
.day.out{background:#f8f7f3;color:#bbb}
.day .num{font-size:12px;font-weight:700;margin-bottom:1px;display:flex;justify-content:space-between;align-items:center}
.day.today .num span{background:var(--today);color:#111;border-radius:6px;padding:0 6px}
.day .add{opacity:0;font-size:16px;color:var(--muted);line-height:1}
.day:hover .add{opacity:1}
.item{display:block;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .b{font-weight:500;opacity:.85}
.more{font-size:11px;color:var(--muted);font-weight:600}
.item{cursor:grab;touch-action:none}
.day.drop{outline:2px dashed #111;outline-offset:-3px;background:#fff8d6}
.ghost{position:fixed;pointer-events:none;z-index:30;opacity:.92;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:12px!important;height:auto!important;padding:4px 8px!important;max-width:200px}
.ghost .b{display:inline!important}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.item.src{opacity:.35}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;z-index:40;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:var(--today);padding:0;font-size:13px}
/* modal */
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.back.show{display:flex}
.modal{background:var(--card);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:640px){.back{align-items:center}.modal{border-radius:18px}}
.modal h2{font-family:var(--head);font-size:17px;margin:0 0 4px;text-transform:uppercase}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;font-family:var(--body);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #111;outline-offset:-1px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tg{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.3px;opacity:.75;margin-right:3px;vertical-align:1px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.mode span{padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.mode span.on{background:#111;color:#fff}
.bar.brands{margin-top:-2px}
.chip-f.brand{cursor:pointer}
.chip-f.brand:after{content:'✎';font-size:11px;color:var(--muted);margin-left:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw i{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;display:block}
.sw i.on{border-color:#111;box-shadow:inset 0 0 0 2px #fff}
.swc{display:flex;align-items:center;gap:8px;margin-top:8px}
.swc input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;flex:none}
.swc .hex{width:120px;font-family:ui-monospace,Menlo,monospace;font-size:14px;padding:7px 10px;text-transform:uppercase}
.swc .hex.bad{border-color:#c62828;outline-color:#c62828}
.swc span{font-size:12px;color:var(--muted)}
.qrbox{display:flex;gap:14px;align-items:flex-start}
#qr{width:150px;height:150px;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center}
#qr svg{width:100%;height:100%;display:block}
#setupLink{font-size:12px;font-family:ui-monospace,Menlo,monospace}
@media(max-width:480px){.qrbox{flex-direction:column;align-items:center}#qr{width:200px;height:200px}}
.seg button{padding:10px 4px;font-size:13px}
.seg button.on{color:#fff}
.row{display:flex;gap:8px;margin-top:18px}
.row .sp{flex:1}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.li{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.li:hover{border-color:#bbb}
.li .t{font-weight:700;font-size:14px}
.li .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 10px}
.err{color:#c62828;font-size:13px;margin-top:8px;min-height:1em}
.modal.wide{max-width:760px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.sec h3{font-family:var(--head);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:10px 0 0;color:#111}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.g.g4{grid-template-columns:repeat(4,1fr)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
.up{display:grid;grid-template-columns:40px 1fr 1.2fr 2fr;gap:6px 8px;align-items:center;margin-top:8px}
.up .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.up b{font-size:13px}
.up select,.up input{padding:8px 8px;font-size:14px}
textarea{width:100%;font-family:var(--body);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-height:70px;resize:vertical}
.modal select{appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cp{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff}
.cp.on{background:#111;color:#fff;border-color:#111}
.cp.add{border-style:dashed;color:var(--muted)}
.ml{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.mli{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.mli:first-child{border-top:0}
.mli span{font-weight:700;font-size:14px;flex:1}
.mli small{font-size:11px;color:var(--muted)}
.clash{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.clash>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.clash span{color:var(--muted);font-size:12px}.clash em{font-style:normal;color:#111;font-weight:700}
.plats{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.pl-l{font-size:11px;font-weight:700;color:var(--muted);padding:0 6px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.pl{white-space:nowrap;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;cursor:pointer;user-select:none;color:#666;border:1px solid transparent}
.pl b{font-weight:600;opacity:.7;margin-left:2px}
.pl:hover{background:#f1f0ec}
.pl.on{color:#fff}.pl.all.on{background:#111}
.pl.on{background:#111}.pl.none{font-weight:700}
.ttl{display:flex;flex-direction:column;gap:8px}
.tabs{display:inline-flex;background:#e9e7e1;border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.tabs button{border:0;background:transparent;padding:6px 12px;font-size:13px;border-radius:8px;color:#555}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:none}
.tabs button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.12)}
body.v-day .main,body.v-week .main,body.v-todo .main,body.v-stat .main{display:none}
.statview{display:flex;flex-direction:column;gap:12px}
.st-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.st-top h2{font-family:var(--head);font-size:18px;margin:0;text-transform:uppercase;flex:1;min-width:220px}
.st-top h2 small{display:block;font-family:var(--body);text-transform:none;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-family:var(--head);font-size:34px;font-weight:800;line-height:1.1;margin-top:6px}
.tile .v small{font-size:15px;color:var(--muted);font-weight:700}
.tile .s{font-size:12px;color:var(--muted);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-family:var(--head);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:0 0 2px}
.card .sub2{font-size:12px;color:var(--muted);margin-bottom:12px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:600;color:#444;margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid #ddd;padding-top:16px;position:relative}
.col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;min-width:0;position:relative;height:100%;justify-content:flex-start;cursor:default}
.col .sg{border-radius:0}
.col .sg:last-child{border-radius:4px 4px 0 0}
.col .n{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#444}
.col:hover .sg{filter:brightness(1.12)}
.xax{display:flex;gap:2px;margin-top:4px}
.xax span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0}
.xax span.we{color:#b10202}
.xax span.td{color:#111;font-weight:800}
.segbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.segbar div{height:100%;cursor:default}
.segbar div:hover{filter:brightness(1.12)}
.rows{display:flex;flex-direction:column;gap:9px}
.hr{display:grid;grid-template-columns:132px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.hr .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .tr{height:12px;background:#efeee9;border-radius:99px;overflow:hidden;position:relative;cursor:default}
.hr .tr i{display:block;height:100%;border-radius:99px}
.hr .vl{font-size:12px;font-weight:700;text-align:right;color:#333;white-space:nowrap}
.badge{display:inline-block;font-size:10px;font-weight:800;background:#fff1c2;color:#7a5a00;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.pfr{display:grid;grid-template-columns:40px minmax(0,1fr) 56px;gap:4px 10px;align-items:center}
.pfr .chipz{grid-column:2/4;justify-content:flex-start!important}
.pfr .chipz{display:flex;gap:4px;flex-wrap:wrap}
.pfr .chipz span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#f1f0ec;color:#555;white-space:nowrap}
.pfr .chipz span.gg{background:#fde8e8;color:#b10202}
.fun{display:flex;flex-wrap:wrap;gap:8px}
.fun span{font-size:13px;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fun b{font-weight:800}
.fun .clk{cursor:pointer;border-color:#f3c2c2;background:#fdf1f1}
.pfr .chipz span[data-pf]{cursor:pointer}.pfr .chipz span[data-pf]:hover{outline:1px solid #999}
.hr .tr[data-pf]{cursor:pointer}
.upl{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;margin:8px 0}
.upi{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.upi:hover{border-color:#bbb;background:#faf9f6}
.uph{display:flex;align-items:center;gap:8px}
.uph .pf{font-size:10px;padding:2px 6px;border-radius:5px;min-width:26px}
.uph b{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upm{font-size:12px;color:var(--muted);margin-top:3px}
.upn{font-size:11.5px;color:#8a1c1c;background:#fdf1f1;border-radius:6px;padding:5px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
#tip{position:fixed;z-index:90;pointer-events:none;background:#111;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;display:none;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip b{font-size:14px}
@media(max-width:800px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}.tile .v{font-size:28px}.hr{grid-template-columns:104px minmax(0,1fr) 50px}}
.td-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.td-ctl select{width:auto;padding:7px 10px;font-size:14px;font-weight:700}
.td-per{display:inline-flex;background:#e9e7e1;border-radius:10px;padding:3px;gap:2px}
.td-per button{border:0;background:transparent;padding:6px 11px;font-size:13px;border-radius:8px;color:#555}
.td-per button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.td-prog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.td-prog span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#f1f0ec;cursor:pointer}
.td-prog span.full{background:#d4edbc;color:#11734b}
.td-prog span.on{outline:2px solid #111}
.td-bar{height:6px;border-radius:99px;background:#eee;overflow:hidden;margin:-4px 0 14px}
.td-bar i{display:block;height:100%;background:#12a150}
.td-row{display:grid;grid-template-columns:28px 92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line)}
.td-row.done .tt b{text-decoration:line-through;color:#999}
.td-ck{width:22px;height:22px;border-radius:6px;border:2px solid #bbb;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;padding:0}
.td-row.done .td-ck{background:#12a150;border-color:#12a150}
.td-role{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 7px;border-radius:6px;text-align:center;color:#fff}
.td-role.Writing{background:#1d3f8f}.td-role.Shooting{background:#7a5230}.td-role.Desain{background:#2f6bff}.td-role.Edit{background:#ff4d2e}.td-role.Cover{background:#9b3dff}.td-role.Manual{background:#444}
.td-row .tt{min-width:0;cursor:pointer}
.td-row .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-row .tt span{font-size:12px;color:var(--muted)}
.td-who{font-size:12px;font-weight:800;color:#444;white-space:nowrap}
.td-late .dv-sec{color:#b10202}
.td-del{border:0;background:none;color:#999;font-size:16px;padding:2px 6px}
.td-del:hover{color:#b10202}
@media(max-width:640px){.td-row{grid-template-columns:26px minmax(0,1fr);row-gap:4px}.td-role{grid-column:2;justify-self:start}.td-row .tt{grid-column:2}.td-who{grid-column:2}}
[hidden]{display:none!important}
.weekview{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wkday{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:420px;display:flex;flex-direction:column;min-width:0}
.wkday.today{border-color:#111;box-shadow:0 0 0 1px #111}
.wkday.drop{outline:2px dashed #111;outline-offset:-3px;background:#fff8d6}
.wkh{padding:9px 10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:6px;cursor:pointer}
.wkh .dn{font-family:var(--head);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.wkh .dd{font-size:18px;font-weight:800}
.wkday.today .wkh .dd{background:var(--today);border-radius:6px;padding:0 6px}
.wkh .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.wkb{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1;cursor:pointer}
.wkc{border-radius:8px;padding:7px 8px 7px 10px;background:#fafaf8;border:1px solid var(--line);border-left:5px solid var(--bc);cursor:grab;touch-action:none}
.wkc:hover{background:#fff;border-color:#ccc}

<script id="app-js">
(function(){

const EXTRA=['cover','akun','segmen','jamYT','jamIG','jamTT','jamFB','producer','writing','shooting','designer','editor','talent1','talent2','production','stYT','stIG','stTT','stFB','idYT','idIG','idTT','idFB','catatan','eventId'];

// daftar yang bisa ditambah + field yang memakainya
const LISTOF={akun:'akun',producer:'tim',designer:'tim',editor:'tim',talent1:'tim',talent2:'tim',stYT:'status',stIG:'status',stTT:'status',stFB:'status'};
const LISTNAME={akun:'Akun',segmen:'Segmen',tim:'Orang / Tim',status:'Status',brand:'Brand Tap In'};
const hiddenOf=l=>new Set(((state.options&&state.options[l+'_hapus'])||[]).map(v=>String(v).toLowerCase()));
const opts=l=>{const base=l==='tim'?OPT.tim:OPT[l]||[];const fromSheet=(state.lists&&state.lists[l])||[];const add=(state.options&&state.options[l])||[];const hid=hiddenOf(l);
  return [...new Set([...base,...fromSheet,...add])].filter(v=>!hid.has(String(v).toLowerCase()))};
function addOption(list,value){
  value=String(value||'').trim();if(!value)return false;
  const hl=state.options[list+'_hapus']||[];
  if(hl.some(v=>v.toLowerCase()===value.toLowerCase())){ // pernah dihapus → munculin lagi
    state.options[list+'_hapus']=hl.filter(v=>v.toLowerCase()!==value.toLowerCase());lsSave();
    if(API){queue.push({op:'optionDel',list:list+'_hapus',value});flush()}
    if((list==='brand'?brands():opts(list)).some(v=>v.toLowerCase()===value.toLowerCase()))return true;
  }
  if(opts(list).some(v=>v.toLowerCase()===value.toLowerCase()))return true;
  state.options[list]=[...(state.options[list]||[]),value];lsSave();
  if(API){queue.push({op:'option',list,value});flush()}
  return true;
}
const KNAME={date:'Tanggal',title:'Judul',type:'Jenis',brand:'Brand Tap In',akun:'Akun',segmen:'Segmen',producer:'Producer',writing:'Writing',shooting:'Shooting',designer:'Designer',editor:'Editor',talent1:'Talent 1',talent2:'Talent 2',production:'Production',cover:'Cover/Thumb',catatan:'Catatan',eventId:'Event ID'};
const kname=k=>KNAME[k]||(/^jam(..)$/.test(k)?'Jam up '+k.slice(3):/^st(..)$/.test(k)?'Status '+k.slice(2):/^id(..)$/.test(k)?'Post ID '+k.slice(2):k);
function askConflict(op,clash){
  const it=state.items.find(x=>x.id===(op.cid||op.id))||{};
  const mine=k=>{const v=op.changes&&k in op.changes?op.changes[k]:(op.cols&&op.cols[k]);return k==='type'?(T[v]||{}).name||v:v};
  const w=document.createElement('div');w.className='back show';w.style.zIndex=80;
  w.innerHTML=`<div class="modal" style="max-width:440px"><h2>Udah diubah orang lain</h2>
    <div class="sub">"${esc(it.title||'Konten ini')}" barusan diubah di Sheet setelah lo buka. Bagian yang bentrok:</div>
    <div class="clash">${clash.map(c=>`<div><b>${esc(c.k==='col'?c.col:kname(c.k))}</b><span>di Sheet sekarang: <em>${esc(c.cur||'(kosong)')}</em></span><span>punya lo: <em>${esc(nv(mine(c.k==='col'?c.col:c.k))||'(kosong)')}</em></span></div>`).join('')}</div>
    <div class="row"><button id="cfKeep">Pakai yang di Sheet</button><span class="sp"></span><button class="primary" id="cfOver">Timpa pakai punya gue</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('#cfOver').onclick=()=>{w.remove();queue[0]={...queue[0],force:true};flush()};
  w.querySelector('#cfKeep').onclick=()=>{w.remove();queue.shift();if(queue.length)flush();else{setStatus('Pakai data di Sheet');pull(false,true)}};
}
function pinDialog(onDone){
  const w=document.createElement('div');w.className='back show';w.style.zIndex=70;
  w.innerHTML=`<div class="modal" style="max-width:340px"><h2>Masukin PIN</h2><div class="sub">Buat nambah, ngedit, atau ngehapus konten. Cukup sekali di browser ini.</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><div class="err" id="pinErr"></div>
    <div class="row"><span class="sp"></span><button id="pinNo">Batal</button><button class="primary" id="pinOk">Lanjut</button></div></div>`;
  document.body.appendChild(w);
  const inp=w.querySelector('#pinIn'),err=w.querySelector('#pinErr'),ok=w.querySelector('#pinOk');
  const finish=v=>{w.remove();onDone(v)};
  const go=async()=>{const v=inp.value.trim();if(!v){err.textContent='Isi PIN-nya dulu.';return}
    ok.disabled=true;ok.textContent='Ngecek…';
    try{const r=await fetch(API,{method:'POST',body:JSON.stringify({op:'checkPin',pin:v})});const d=await r.json();
      if(d.ok)return finish(v);
      const m=String(d.error||'');err.textContent=/pin_wrong/.test(m)?'PIN salah.':/pin_locked/.test(m)?'Kebanyakan salah, tunggu 15 menit.':/pin_not_set/.test(m)?'PIN belum diatur di Apps Script.':'Gagal ngecek PIN.';
    }catch(e){err.textContent='Gagal nyambung, cek internet.'}
    ok.disabled=false;ok.textContent='Lanjut'};
  ok.onclick=go;w.querySelector('#pinNo').onclick=()=>finish(null);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}if(e.key==='Escape'){e.stopPropagation();finish(null)}});
  setTimeout(()=>inp.focus(),30);
}
// hapus pilihan dari daftar (disembunyiin buat semua orang; data konten lama nggak diubah)
function removeOption(list,value){
  value=String(value||'').trim();if(!value)return;
  if(API&&scriptVer<3){toast('Deploy script terbaru dulu buat hapus dari daftar.');return}
  const cust=state.options[list]||[];
  if(cust.some(v=>v.toLowerCase()===value.toLowerCase())){
    state.options[list]=cust.filter(v=>v.toLowerCase()!==value.toLowerCase());
    if(API)queue.push({op:'optionDel',list,value});
  }
  state.options[list+'_hapus']=[...(state.options[list+'_hapus']||[]),value];
  if(API)queue.push({op:'option',list:list+'_hapus',value});
  lsSave();if(API)flush();
}
const LISTS_EDIT=[['tim','Orang / Tim'],['akun','Akun'],['segmen','Segmen'],['status','Status upload'],['brand','Brand Tap In']];
function manageLists(start){
  let cur=start||'tim';
  const w=document.createElement('div');w.className='back show';w.style.zIndex=60;
  document.body.appendChild(w);
  const draw=()=>{
    const list=cur==='brand'?brands():opts(cur), used=v=>state.items.filter(i=>cur==='tim'?['producer','designer','editor','talent1','talent2'].some(k=>i[k]===v):cur==='status'?['stYT','stIG','stTT','stFB'].some(k=>i[k]===v):cur==='segmen'?String(i.segmen||'').split(/\s*,\s*/).includes(v):String(i[cur]||'')===v).length;
    w.innerHTML=`<div class="modal" style="max-width:440px"><h2>Kelola daftar</h2>
      <div class="sub">Hapus/tambah pilihan. Ikut kesimpen ke Sheet, jadi berlaku buat semua orang. Konten lama yang udah pakai nama itu nggak berubah.</div>
      <div class="chips" style="margin-bottom:10px">${LISTS_EDIT.map(([k,n])=>`<span class="cp${k===cur?' on':''}" data-l="${k}">${n}</span>`).join('')}</div>
      <div class="ml">${list.map(v=>{const n=used(v);return `<div class="mli"><span>${esc(v)}</span><small>${n?n+' konten di periode yang kebuka':''}</small><button class="td-del" data-v="${esc(v)}" title="Hapus dari daftar">✕</button></div>`}).join('')||'<div class="dv-empty">Daftar kosong.</div>'}</div>
      <div class="row" style="margin-top:10px"><input id="mlIn" placeholder="Tambah ${esc((LISTS_EDIT.find(x=>x[0]===cur)||[])[1]||'')} baru" autocomplete="off"><button id="mlAdd">Tambah</button></div>
      <div class="row"><span class="sp"></span><button class="primary" id="mlClose">Selesai</button></div></div>`;
    w.querySelectorAll('.cp[data-l]').forEach(c=>c.onclick=()=>{cur=c.dataset.l;draw()});
    w.querySelectorAll('.mli .td-del').forEach(b=>{let armed=false;b.onclick=()=>{
      if(!armed){armed=true;b.textContent='Hapus?';b.style.color='#b10202';return}
      removeOption(cur,b.dataset.v);draw()}});
    const add=()=>{const v=w.querySelector('#mlIn').value.trim();if(!v)return;addOption(cur,v);draw()};
    w.querySelector('#mlAdd').onclick=add;w.querySelector('#mlIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
    w.querySelector('#mlClose').onclick=()=>{w.remove();render()};
  };
  w.onclick=e=>{if(e.target===w){w.remove();render()}};
  draw();
}
function mini(title,onOk){
  const w=document.createElement('div');w.className='back show';w.style.zIndex=60;
  w.innerHTML=`<div class="modal" style="max-width:360px"><h2>${esc(title)}</h2><input id="miniIn" autocomplete="off" placeholder="Ketik nama baru"><div class="err" id="miniErr"></div><div class="row"><span class="sp"></span><button id="miniNo">Batal</button><button class="primary" id="miniOk">Tambah</button></div></div>`;
  document.body.appendChild(w);
  const inp=w.querySelector('#miniIn'),done=()=>w.remove();
  const ok=()=>{const v=inp.value.trim();if(!v){w.querySelector('#miniErr').textContent='Isi dulu namanya.';return}onOk(v);done()};
  w.querySelector('#miniOk').onclick=ok;w.querySelector('#miniNo').onclick=()=>{onOk(null);done()};
  w.onclick=e=>{if(e.target===w){onOk(null);done()}};

  setTimeout(()=>inp.focus(),30);
}
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];
const LS='sp-timeline-v1';

let state;
try{state=JSON.parse(document.getElementById('app-data').textContent)}catch(e){state={items:[]}}
if(!state||!Array.isArray(state.items))state={items:[]};
if(!state.brandColors||typeof state.brandColors!=='object')state.brandColors={};
if(!state.options||typeof state.options!=='object')state.options={};
if(!Array.isArray(state.todos))state.todos=[];
let mode='brand';try{mode=localStorage.getItem('sp-timeline-mode')||'brand'}catch(e){}
const bkey=b=>b.trim().toLowerCase();
function brandColor(b){
  if(!b)return NOBRAND;
  const k=bkey(b);
  if(!state.brandColors[k]){
    const used=new Set(Object.values(state.brandColors));
    state.brandColors[k]=PALETTE.find(c=>!used.has(c))||PALETTE[Object.keys(state.brandColors).length%PALETTE.length];
  }
  return state.brandColors[k];
}

function diffOps(){
  const now=snap(state), ops=[];
  for(const it of state.items){
    const o=synced.items[it.id], n=now.items[it.id], kk=(it.src||'pv')==='kk';
    if(!o){ops.push(kk?{op:'kkAdd',item:{...it},cid:it.id}:{op:'upsert',item:it});continue}
    const ch={};ALLK.forEach(k=>{if(k!=='id'&&o[k]!==n[k])ch[k]=n[k]});
    if(!Object.keys(ch).length)continue;
    const prev={};Object.keys(ch).forEach(k=>prev[k]=o[k]);
    if(kk){ops.push(scriptVer>=2?{op:'kkUpdate',ref:refOf(o),changes:ch,prev,cid:it.id}:{op:'kkUpdate',ref:refOf(o),changes:ch,cid:it.id});continue}
    if(scriptVer>=2){ // preview: kirim kolom yang berubah aja
      const c2={},cols={},pc={};Object.keys(ch).forEach(k=>{if(XCOL[k]){cols[XCOL[k]]=ch[k];pc[XCOL[k]]=o[k]}else c2[k]=ch[k]});
      ops.push({op:'pvUpdate',id:it.id,changes:c2,cols,prev:{...prev,cols:pc},cid:it.id});
    }else ops.push({op:'upsert',item:it});

}

async function flush(){

  busy=true;
  while(queue.length){
    setStatus('Menyimpan ke Sheet…');
    const op=queue[0];
    try{
      const res=await apiPost(op);queue.shift();
      if(op.cid&&res&&res.row){const it=state.items.find(x=>x.id===op.cid);if(it)it.row=res.row;if(synced&&synced.items[op.cid])synced.items[op.cid].row=res.row}
    }catch(e){
      if(e.conflict){busy=false;askConflict(op,e.conflict);return}
      const m=String(e.message||e),pm=m.match(/(pin_wrong|pin_locked|pin_not_set): (.*)/);
      if(pm){busy=false;
        if(pm[1]==='pin_wrong'){savePin('');askPin(v=>{savePin(v);flush()});toast('PIN salah, coba lagi.');return}
        dropPending(pm[2]+'.');return}
      const mm=m.match(/(notfound|dobel): (.*)/);
      if(mm){ // baris di KALENDER KONTEN berubah/hilang → buang perubahan yang antre, tarik ulang data
        queue.length=0;busy=false;toast('Gagal simpan: '+mm[2]+'. Data ditarik ulang.');pull(false,true);return}
      setStatus('Gagal simpan ke Sheet — dicoba lagi');busy=false;setTimeout(flush,8000);return}
  }
  busy=false;lastSync=new Date();setStatus('Tersimpan di Sheet '+hhmm(lastSync));
}

// ---- drag & drop (mouse: drag; touch: hold ~0.3s then drag)
let justDragged=false;
function attachDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const id=el.dataset.id, sx=e.clientX, sy=e.clientY, touch=e.pointerType!=='mouse';
    let active=false, ghost=null, over=null, holdT=null, cancelled=false;
    const begin=()=>{
      active=true;
      ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=Math.max(el.offsetWidth,140)+'px';
      document.body.appendChild(ghost);document.body.classList.add('dragging');el.classList.add('src');
      if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
      move(lastX,lastY);
    };
    let lastX=sx,lastY=sy;
    const move=(x,y)=>{
      ghost.style.left=(x-20)+'px';ghost.style.top=(y-14)+'px';
      const t=document.elementFromPoint(x,y);const d=t&&t.closest('.day,.wkday');
      if(d!==over){if(over)over.classList.remove('drop');over=d;if(over)over.classList.add('drop')}
    };
    if(touch)holdT=setTimeout(()=>{if(!cancelled)begin()},300);
    const onMove=ev=>{
      lastX=ev.clientX;lastY=ev.clientY;
      if(!active){
        const dist=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(touch){if(dist>8){cancelled=true;clearTimeout(holdT)}return}
        if(dist>5)begin();else return;
      }
      ev.preventDefault();move(ev.clientX,ev.clientY);
    };
    const onUp=()=>{
      clearTimeout(holdT);
      removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
      if(!active)return;
      document.body.classList.remove('dragging');ghost.remove();el.classList.remove('src');
      if(over)over.classList.remove('drop');
      justDragged=true;setTimeout(()=>justDragged=false,50);
      const it=state.items.find(x=>x.id===id);
      if(over&&it&&over.dataset.k!==it.date){
        const from=it.date;it.date=over.dataset.k;
        state.items.sort((a,b)=>a.date.localeCompare(b.date));
        save();render();
        toast(`Dipindah ke ${fmtDate(it.date)}`,()=>{it.date=from;state.items.sort((a,b)=>a.date.localeCompare(b.date));save();render()});
      }
    };
    addEventListener('pointermove',onMove,{passive:false});addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
let toastEl=null,toastT=null;
function toast(msg,undo,act){
  if(toastEl)toastEl.remove();clearTimeout(toastT);
  toastEl=document.createElement('div');toastEl.className='toast';
  toastEl.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-b="u">Batalin</button>':''}${act?`<button data-b="a">${esc(act.label)}</button>`:''}`;
  document.body.appendChild(toastEl);
  if(undo)toastEl.querySelector('[data-b=u]').onclick=()=>{undo();toastEl.remove();toastEl=null};
  if(act)toastEl.querySelector('[data-b=a]').onclick=()=>{toastEl.remove();toastEl=null;act.fn()};
  toastT=setTimeout(()=>{if(toastEl){toastEl.remove();toastEl=null}},act?7000:4000);
}

const normHex=v=>{v=String(v||'').trim().replace(/^#?/,'#');if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v.slice(1).split('').map(x=>x+x).join('');return /^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null};
// pilihan warna: palet + warna custom yang sudah dipakai + color picker & kolom hex
function mountSwatches(box,sel,onPick){
  sel=normHex(sel)||PALETTE[0];
  const used=[...new Set(Object.values(state.brandColors).map(normHex).filter(c=>c&&!PALETTE.includes(c)))];
  const all=[...PALETTE,...used];if(!all.includes(sel))all.push(sel);
  box.innerHTML=`<div class="sw">${all.map(c=>`<i data-c="${c}" title="${c.toUpperCase()}" style="background:${c}"></i>`).join('')}</div>
    <div class="swc"><input type="color" aria-label="Pilih warna custom"><input class="hex" maxlength="7" placeholder="#RRGGBB" aria-label="Kode hex"><span>warna custom / hex</span></div>`;
  const pick=box.querySelector('input[type=color]'),hex=box.querySelector('.hex');
  const show=c=>{box.querySelectorAll('.sw i').forEach(i=>i.classList.toggle('on',i.dataset.c===c));pick.value=c;if(document.activeElement!==hex){hex.value=c.toUpperCase()};hex.classList.remove('bad')};
  // pilih warna: cuma ganti pilihan, palet tidak ditambah (warna custom baru muncul di palet setelah disimpan ke brand)
  const set=c=>{c=normHex(c);if(!c)return;show(c);onPick(c)};
  box.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>set(i.dataset.c));
  pick.addEventListener('input',()=>set(pick.value));
  hex.addEventListener('input',()=>{const c=normHex(hex.value);hex.classList.toggle('bad',!!hex.value&&!c&&hex.value.replace('#','').length>=6);if(c&&hex.value.replace('#','').length===6)set(c)});
  hex.addEventListener('blur',()=>{const c=normHex(hex.value);if(c)set(c);else show(normHex(pick.value))});
  show(sel);
}

  if(cur.src==='kk'){const ev=modal.querySelector('[data-k=eventId]');if(ev){ev.readOnly=true;ev.title='Diisi otomatis sama sistem KALENDER KONTEN'}}
  modal.querySelectorAll('#segChips .cp:not(.add)').forEach(el=>el.onclick=()=>el.classList.toggle('on'));
  modal.querySelector('#segAdd').onclick=()=>mini('Tambah Segmen',v=>{if(!v)return;
    let ex=[...modal.querySelectorAll('#segChips .cp:not(.add)')].find(c=>c.dataset.v.toLowerCase()===v.toLowerCase());
    if(!ex){addOption('segmen',v);ex=document.createElement('span');ex.className='cp';ex.dataset.v=v;ex.textContent=v;ex.onclick=()=>ex.classList.toggle('on');modal.querySelector('#segAdd').before(ex)}
    ex.classList.add('on')});
  modal.querySelectorAll('select[data-k]').forEach(s=>{if(!LISTOF[s.dataset.k])return;s.dataset.prev=s.value;
    s.addEventListener('change',()=>{
      if(s.value!=='__add'){s.dataset.prev=s.value;return}
      const list=LISTOF[s.dataset.k];
      mini('Tambah '+LISTNAME[list],v=>{
        if(!v){s.value=s.dataset.prev||'';return}
        addOption(list,v);
        const val=opts(list).find(x=>x.toLowerCase()===v.toLowerCase())||v;
        modal.querySelectorAll('select[data-k]').forEach(o=>{if(LISTOF[o.dataset.k]!==list)return;const keep=o===s?val:o.value;o.innerHTML=optHtml(o.dataset.k,opts(list),keep);o.value=keep;o.dataset.prev=keep});
      });
    })});
  const segs=modal.querySelectorAll('.seg button');
  const paint=()=>segs.forEach(b=>{const on=b.dataset.t===cur.type;b.classList.toggle('on',on);b.style.background=on?T[b.dataset.t].color:'';b.style.borderColor=on?T[b.dataset.t].color:''});
  segs.forEach(b=>b.onclick=()=>{cur.type=b.dataset.t;paint()});paint();
  let pickColor=null;
  const bIn=modal.querySelector('#fBrand'), bcWrap=modal.querySelector('#bcWrap');
  const paintBC=()=>{const v=bIn.value.trim();if(!v){bcWrap.innerHTML='';pickColor=null;return}
    const k=bkey(v);const existing=state.brandColors[k];
    const sel=pickColor||existing||PALETTE.find(c=>!new Set(Object.values(state.brandColors)).has(c))||PALETTE[0];
    mountSwatches(bcWrap,sel,c=>pickColor=c);};
  bIn.dataset.prev=bIn.value;
  bIn.addEventListener('change',()=>{
    if(bIn.value!=='__add'){bIn.dataset.prev=bIn.value;pickColor=null;paintBC();return}
    bIn.value=bIn.dataset.prev||'';
    mini('Tambah Brand Tap In',v=>{if(!v)return;
      const ex=brands().find(b=>b.toLowerCase()===v.toLowerCase());
      if(!ex)addOption('brand',v);
      const val=ex||v;bIn.innerHTML=brandOpts(val);bIn.value=val;bIn.dataset.prev=val;pickColor=null;paintBC();
      if(!ex&&cur.src==='kk')toast(`"${val}" ditambah. Di KALENDER KONTEN bakal ditandain merah sampai brand ini masuk dropdown sheet.`);
    });
  });
  paintBC();
  modal.querySelector('#cancel').onclick=close;
  const del=modal.querySelector('#del');
  if(del){let armed=false;del.onclick=()=>{
    if(!armed){armed=true;del.textContent=cur.src==='kk'?'Yakin? Kehapus juga dari KALENDER KONTEN':'Yakin hapus?';return}
    state.items=state.items.filter(x=>x.id!==item.id);save();close();render();
  }}
  // baca isi form jadi satu record (dipakai Simpan & Duplikat)
  const buildRec=()=>{
    const title=modal.querySelector('#fTitle').value.trim();
    const date=modal.querySelector('#fDate').value;
    if(!title){modal.querySelector('#fErr').textContent='Judul konten wajib diisi.';return null}
    if(!date){modal.querySelector('#fErr').textContent='Tanggal wajib diisi.';return null}
    if(modal.querySelector('#fBrand').value==='__add')modal.querySelector('#fBrand').value='';
    const bv=modal.querySelector('#fBrand').value.trim();
    if(bv&&pickColor)state.brandColors[bkey(bv)]=pickColor;
    if(bv)brandColor(bv);
    const rec={id:item?item.id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,type:cur.type,brand:modal.querySelector('#fBrand').value.trim(),date};
    EXTRA.forEach(k2=>rec[k2]='');
    modal.querySelectorAll('[data-k]').forEach(el=>{const v=el.value.trim();rec[el.dataset.k]=v==='__add'?'':v});
    rec.segmen=[...modal.querySelectorAll('#segChips .cp.on')].map(el=>el.dataset.v).join(', ');
    rec.src=cur.src||'pv';if(item&&item.row)rec.row=item.row;if(item&&item.jenis)rec.jenis=item.jenis;
    if(rec.src==='kk'&&item)rec.eventId=item.eventId||'';
    return rec;
  };
  const dupBtn=modal.querySelector('#dup');
  if(dupBtn)dupBtn.onclick=()=>{
    const base=buildRec();if(!base)return;
    const to=cur.src==='kk'?'pv':'kk';
    const copy={...base,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:to};
    delete copy.row;delete copy.jenis;copy.eventId=''; // salinan = baris baru, bukan baris lama
    if(to==='kk')['stYT','stIG','stTT','stFB','idYT','idIG','idTT','idFB'].forEach(k=>copy[k]=''); // jangan sampai kebaca otomasi upload
    state.items.push(copy);state.items.sort((a,b)=>a.date.localeCompare(b.date));
    save();close();render();
    toast(`Salinan jadi ${to==='kk'?'Konten (masuk KALENDER KONTEN)':'Preview'} dibuat · ${fmtDate(copy.date)}`,null,{label:'Buka',fn:()=>{const it=state.items.find(x=>x.id===copy.id);if(it)openForm(it)}});
  };
  modal.querySelector('#f').onsubmit=e=>{
    e.preventDefault();
    const rec=buildRec();if(!rec)return;
    if(isNew)state.items.push(rec);else state.items=state.items.map(x=>x.id===rec.id?rec:x);
    state.items.sort((a,b)=>a.date.localeCompare(b.date));
    save();close();render();
  };
  back.classList.add('show');
  setTimeout(()=>modal.querySelector('#fTitle').focus(),50);
}

// saving: publish a new version of this page with the data embedded
let timer=null;
function buildDoc(){
  const css=document.getElementById('app-css').textContent;
  const js=document.getElementById('app-js').textContent;
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const head='\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Timeline Produksi Konten — Shoe Police</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">\n';
  return '<!DOCTYPE html>\n<html lang="id">\n<head>'+head+'<style id="app-css">'+css+'</style>\n</head>\n<body>'
    +cleanBody()
    +'<script type="application/json" id="app-data">'+json+'</'+'script>\n<script id="app-js">'+js+'</'+'script>\n</body>\n</html>\n';
}
function cleanBody(){
  // static shell only — never the rendered calendar
  return `
<div class="wrap">
  <header>
    <div class="ttl"><h1>Timeline Produksi Konten<small>Shoe Police · klik tanggal buat nambah / edit konten</small></h1>
      <nav class="tabs" id="tabs"><button data-v="cal">Kalender</button><button data-v="week">Mingguan</button><button data-v="day">Upload Harian</button><button data-v="todo">To-do</button><button data-v="stat">Ringkasan</button></nav></div>
    <div class="nav">
      <button class="icon" id="prev" aria-label="Bulan sebelumnya">‹</button>
      <div class="month" id="monthLbl"></div>
      <button class="icon" id="next" aria-label="Bulan berikutnya">›</button>
      <button id="todayBtn">Hari ini</button>
      <button class="icon" id="syncBtn" title="Tarik data terbaru dari Sheet">⟳</button>
      <button class="icon" id="sheetBtn" title="Sambungan Google Sheet">⚙</button>
    </div>
  </header>
  <div class="bar" id="filters"></div>
  <div class="main">
    <div class="grid" id="grid"></div>
    <aside class="side" id="brandBar"></aside>
  </div>
  <section class="weekview" id="weekView" hidden></section>
  <section class="dayview" id="dayView" hidden></section>
  <section class="dayview todoview" id="todoView" hidden></section>
  <section class="statview" id="statView" hidden></section>
</div>

<div class="back" id="back">
  <div class="modal" id="modal"></div>
</div>

`;
}
function save(){
  localRev++;
  lsSave();
  if(API){syncRemote();return}
  if(!canPublish){setStatus('Mode lokal (cuma di browser ini)');return}
  setStatus('Menyimpan…');
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{await artifact.publish(buildDoc());setStatus('Tersimpan')}
    catch(e){
      const c=e&&(e.code||e.name||e.message)||'';
      if(String(c).includes('conflict'))setStatus('Ada perubahan dari device lain, memuat ulang…');
      else if(/not_granted|not_writer/.test(String(c))){canPublish=false;setStatus('Mode lihat saja')}
      else setStatus('Gagal simpan — coba lagi');
    }
  },700);
}

document.getElementById('prev').onclick=()=>{if(view==='day')return shiftDay(-1);if(view==='week')return shiftWeek(-1);if(view==='todo')return shiftTodo(-1);if(view==='stat')return shiftStat(-1);viewM--;if(viewM<0){viewM=11;viewY--}navTo()};
document.getElementById('next').onclick=()=>{if(view==='day')return shiftDay(1);if(view==='week')return shiftWeek(1);if(view==='todo')return shiftTodo(1);if(view==='stat')return shiftStat(1);viewM++;if(viewM>11){viewM=0;viewY++}navTo()};
document.getElementById('todayBtn').onclick=()=>{if(view==='day'||view==='week'||view==='todo'||view==='stat')return goDay(todayKey);viewY=now.getFullYear();viewM=now.getMonth();navTo()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
// refresh garis "sekarang" tiap menit di menu Upload Harian
setInterval(()=>{if(view==='day'&&!back.classList.contains('show'))render()},60000);
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(render,150)});

const setupLink=()=>location.origin+location.pathname+'#api='+encodeURIComponent(API);
function loadQR(){return window.makeQR?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='qr.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
async function showQR(box,text){
  try{await loadQR();const q=window.makeQR(text,'M'),n=q.getModuleCount(),b=4;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+b} ${y+b}h1v1h-1z`;
    box.innerHTML=`<svg viewBox="0 0 ${n+b*2} ${n+b*2}" shape-rendering="crispEdges" role="img" aria-label="QR link setup"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
  }catch(e){box.textContent='QR gagal dimuat — pakai Copy link aja'}
}
function openSheet(){
  modal.classList.remove('wide');
  modal.innerHTML=`<h2>Google Sheet</h2><div class="sub">Tempel URL Web App dari Apps Script (berakhiran <b>/exec</b>) biar data sinkron di semua device.</div>
   <label for="apiIn">URL Web App</label><input id="apiIn" value="${esc(API)}" placeholder="https://script.google.com/macros/s/…/exec">
   <div class="err" id="apiErr"></div>
   <div class="sub" style="margin-top:10px"><a href="${SHEET_URL}" target="_blank" rel="noopener">Buka Google Sheet-nya ↗</a></div>
   <div class="sec"><h3>Daftar pilihan</h3><div class="row" style="margin-top:8px;align-items:center"><span class="sub" style="margin:0;flex:1">Orang, akun, segmen, status, brand</span><button type="button" id="mlBtn">Kelola daftar</button></div></div>
   <div class="sec"><h3>PIN edit</h3><div class="row" style="margin-top:8px;align-items:center"><span class="sub" style="margin:0;flex:1">${PIN?'PIN udah kesimpen di browser ini ✓':'Belum ada PIN — kalender cuma bisa dilihat.'}</span>
     <button type="button" id="pinBtn">${PIN?'Lupain PIN':'Masukin PIN'}</button></div></div>
   ${API&&API!==SHEET_API?`<div class="sec"><h3>Sambungin HP / device lain</h3>
     <div class="sub" style="margin:6px 0 10px">Scan QR ini pakai kamera HP, atau kirim link-nya. Sekali buka di tiap device, langsung nyambung. Jangan disebar ke luar tim.</div>
     <div class="qrbox"><div id="qr">Bikin QR…</div><div style="flex:1;min-width:0"><input id="setupLink" readonly value="${esc(setupLink())}"><div class="row" style="margin-top:8px"><button id="cpLink">Copy link</button><span class="err" id="cpMsg" style="margin:0;color:var(--muted)"></span></div></div></div>
   </div>`:''}
   <div class="row"><span class="sp"></span><button id="cl">Tutup</button><button class="primary" id="ok">Sambungkan</button></div>`;
  modal.querySelector('#cl').onclick=close;
  modal.querySelector('#mlBtn').onclick=()=>{close();manageLists('tim')};
  modal.querySelector('#pinBtn').onclick=()=>{if(PIN){savePin('');openSheet()}else pinDialog(v=>{if(v)savePin(v);openSheet()})};
  if(API&&API!==SHEET_API){
    showQR(modal.querySelector('#qr'),setupLink());
    modal.querySelector('#setupLink').onclick=e=>e.target.select();
    modal.querySelector('#cpLink').onclick=async()=>{const m=modal.querySelector('#cpMsg');
      try{await navigator.clipboard.writeText(setupLink());m.textContent='Link ke-copy ✓'}
      catch(e){const i=modal.querySelector('#setupLink');i.select();try{document.execCommand('copy');m.textContent='Link ke-copy ✓'}catch(_){m.textContent='Copy manual dari kolom di atas'}}};
  }
  modal.querySelector('#ok').onclick=async()=>{
    const v=modal.querySelector('#apiIn').value.trim();const err=modal.querySelector('#apiErr');
    if(v&&!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(v)){err.textContent='URL-nya harus dari script.google.com';return}
    try{localStorage.setItem('sp-timeline-api',v)}catch(e){}
    API=v;synced=null;remoteOk=false;close();render();
    document.getElementById('syncBtn').style.display=API?'':'none';
    if(API)await pull(true);
  };
  back.classList.add('show');
}
document.getElementById('sheetBtn').onclick=openSheet;
if(inClaude)document.getElementById('sheetBtn').style.display='none';

lsLoad();
render();
if(API)pull(true);
document.getElementById('syncBtn').onclick=()=>pull(false,true);
if(!API||inClaude)document.getElementById('syncBtn').style.display='none';
// cek data baru: tiap 20 detik selama tab kebuka, dan tiap balik ke tab/jendela ini
setInterval(()=>{if(!document.hidden)pull(false)},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(false)});
addEventListener('focus',()=>pull(false));
addEventListener('pageshow',e=>{if(e.persisted)pull(false)});
// link khusus dibuka saat halaman sudah terbuka (hash berubah tanpa reload)
addEventListener('hashchange',()=>{
  if(location.hash.indexOf('#api=')!==0)return;
  const v=decodeURIComponent(location.hash.slice(5));
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)||inClaude)return;
  try{localStorage.setItem('sp-timeline-api',v)}catch(e){}
  API=v;synced=null;remoteOk=false;document.getElementById('syncBtn').style.display='';render();pull(true);
});
if(window.claude&&claude.use){
  claude.use('artifact').then(a=>{if(a){artifact=a;canPublish=true;renderFilters()}}).catch(()=>{});
}
})();
</script>
