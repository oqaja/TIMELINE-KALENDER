<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Produksi Konten — Shoe Police</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="app-css">
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#111; --muted:#777; --line:#e3e1da;
  --accent:#111; --today:#ffd400;
  --c-carousel:#2f6bff; --c-short:#ff4d2e; --c-long:#12a150; --c-story:#9b3dff;
  --head:'Futura','Futura PT','Century Gothic','Plus Jakarta Sans',sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:1340px;margin:0 auto;padding:16px}
.main{display:flex;gap:14px;align-items:flex-start}
.main .grid{flex:1;min-width:0}
.side{width:220px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;position:sticky;top:12px}
.side h4{font-family:var(--head);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:2px 6px 2px}
.side .sub2{font-size:11px;color:var(--muted);margin:0 6px 8px}
.bi{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:9px;font-size:13px;font-weight:600}
.bi.brand{cursor:pointer}
.bi.brand:hover{background:#f3f2ee}
.bi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .count{font-weight:600}
.bi .ed{font-size:11px;color:var(--muted);opacity:0}
.bi.brand:hover .ed{opacity:1}
.side .none{font-size:13px;color:var(--muted);padding:4px 6px}
@media(max-width:900px){.main{flex-direction:column;align-items:stretch}.side{width:100%;position:static}.bi .ed{opacity:1}}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.5px;margin:0;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.nav{display:flex;align-items:center;gap:6px}
.nav .month{font-family:var(--head);font-weight:700;font-size:18px;min-width:170px;text-align:center;text-transform:uppercase}
button{font-family:var(--body);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
button:hover{border-color:#bbb}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:#c62828;border-color:#f1c4c4}
.icon{padding:8px 11px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip-f{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chip-f.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.count{color:var(--muted);font-weight:500}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dow{background:#111;color:#fff;font-family:var(--head);font-size:12px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:1px}
.day{background:var(--card);min-height:104px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:#fafaf7}
.day.out{background:#f8f7f3;color:#bbb}
.day .num{font-size:12px;font-weight:700;margin-bottom:1px;display:flex;justify-content:space-between;align-items:center}
.day.today .num span{background:var(--today);color:#111;border-radius:6px;padding:0 6px}
.day .add{opacity:0;font-size:16px;color:var(--muted);line-height:1}
.day:hover .add{opacity:1}
.item{display:block;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .b{font-weight:500;opacity:.85}
.more{font-size:11px;color:var(--muted);font-weight:600}
.item{cursor:grab;touch-action:none}
.day.drop{outline:2px dashed #111;outline-offset:-3px;background:#fff8d6}
.ghost{position:fixed;pointer-events:none;z-index:30;opacity:.92;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:12px!important;height:auto!important;padding:4px 8px!important;max-width:200px}
.ghost .b{display:inline!important}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.item.src{opacity:.35}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;z-index:40;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:var(--today);padding:0;font-size:13px}
/* modal */
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.back.show{display:flex}
.modal{background:var(--card);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:640px){.back{align-items:center}.modal{border-radius:18px}}
.modal h2{font-family:var(--head);font-size:17px;margin:0 0 4px;text-transform:uppercase}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;font-family:var(--body);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #111;outline-offset:-1px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tg{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.3px;opacity:.75;margin-right:3px;vertical-align:1px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.mode span{padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.mode span.on{background:#111;color:#fff}
.bar.brands{margin-top:-2px}
.chip-f.brand{cursor:pointer}
.chip-f.brand:after{content:'✎';font-size:11px;color:var(--muted);margin-left:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw i{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;display:block}
.sw i.on{border-color:#111;box-shadow:inset 0 0 0 2px #fff}
.swc{display:flex;align-items:center;gap:8px;margin-top:8px}
.swc input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;flex:none}
.swc .hex{width:120px;font-family:ui-monospace,Menlo,monospace;font-size:14px;padding:7px 10px;text-transform:uppercase}
.swc .hex.bad{border-color:#c62828;outline-color:#c62828}
.swc span{font-size:12px;color:var(--muted)}
.seg button{padding:10px 4px;font-size:13px}
.seg button.on{color:#fff}
.row{display:flex;gap:8px;margin-top:18px}
.row .sp{flex:1}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.li{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.li:hover{border-color:#bbb}
.li .t{font-weight:700;font-size:14px}
.li .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 10px}
.err{color:#c62828;font-size:13px;margin-top:8px;min-height:1em}
.modal.wide{max-width:760px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.sec h3{font-family:var(--head);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:10px 0 0;color:#111}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.g.g4{grid-template-columns:repeat(4,1fr)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
.up{display:grid;grid-template-columns:40px 1fr 1.2fr 2fr;gap:6px 8px;align-items:center;margin-top:8px}
.up .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.up b{font-size:13px}
.up select,.up input{padding:8px 8px;font-size:14px}
textarea{width:100%;font-family:var(--body);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-height:70px;resize:vertical}
.modal select{appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cp{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff}
.cp.on{background:#111;color:#fff;border-color:#111}
.cp.add{border-style:dashed;color:var(--muted)}
.ok{font-weight:800}
@media(max-width:640px){.g,.g.g4{grid-template-columns:repeat(2,1fr)}.up{grid-template-columns:30px 1fr 1fr}.up .pid{grid-column:2/4}.up .h.pidh{display:none}}
@media(max-width:640px){
  .wrap{padding:10px}
  .day{min-height:74px;padding:4px}
  .item{font-size:0;padding:0;height:7px;border-radius:3px}
  .item .tg{display:none}
  .item .b{display:none}
  .day .add{display:none}
  .nav .month{min-width:120px;font-size:15px}
  .dow{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Timeline Produksi Konten<small>Shoe Police · klik tanggal buat nambah / edit konten</small></h1>
    <div class="nav">
      <button class="icon" id="prev" aria-label="Bulan sebelumnya">‹</button>
      <div class="month" id="monthLbl"></div>
      <button class="icon" id="next" aria-label="Bulan berikutnya">›</button>
      <button id="todayBtn">Hari ini</button>
      <button class="icon" id="sheetBtn" title="Sambungan Google Sheet">⚙</button>
    </div>
  </header>
  <div class="bar" id="filters"></div>
  <div class="main">
    <div class="grid" id="grid"></div>
    <aside class="side" id="brandBar"></aside>
  </div>
</div>

<div class="back" id="back">
  <div class="modal" id="modal"></div>
</div>

<script type="application/json" id="app-data">{"items":[],"brandColors":{}}</script>
<script id="app-js">
(function(){
const TYPES=[
  {id:'carousel',name:'Carousel',color:'var(--c-carousel)'},
  {id:'short',name:'Vid.Pendek',color:'var(--c-short)'},
  {id:'long',name:'Vid.Panjang',color:'var(--c-long)'},
  {id:'story',name:'Story',color:'var(--c-story)'}
];
const TAG={carousel:'CRS',short:'PDK',long:'PJG',story:'STR'};
const PALETTE=['#2f6bff','#ff4d2e','#12a150','#9b3dff','#ff9f0a','#00a5b5','#e0338a','#7a5230','#5c6b00','#d6336c','#1d3f8f','#c9a400','#0f7a5c','#ff6f91','#444444'];
const NOBRAND='#8a8a8a';
// pilihan dropdown, sama dengan DASHBOARD KULTURAMA > KALENDER KONTEN
const OPT={
  akun:['SP','FP','NSP'],
  segmen:['Bedah Sepatu','Detective Shoe','Tierlist/Rekomendasi','Liputan','Versus','Info A1','Stitch N/S','BAP','Cutting','Running','Outdoor','Basket','Kulit/Boots','Sneakers','Voli','Safety','Tactical'],
  tim:['April','Robbi','Budi','Bimar','Yuli','Oky','Umi','Dimas','Herry','Prana'],
  cek:['✅','❌'],
  status:['Acc','Scheduled','Uploaded','Gagal'],
  jam:Array.from({length:96},(_,i)=>String(Math.floor(i/4)).padStart(2,'0')+'.'+String(i%4*15).padStart(2,'0'))
};
const BRAND_LIST=['Startinnglane','Brodo','Unerd','Ortuseight','910','Mills','Weidenmann','Hijack/Akross','Ardiles','Patrobas','Azawear','DBL Media','Spenco','Gumi','Andre Anthony','Geoff Max','Anta','1489','Mario Minardi','Compass','Startstruck','Koku Footwear','Fordive','Humblezing','Erajaya','3Second','Kanky','UNKL347','Stayhoops','DSL','Bodypack','Kluk','Porto X','Outdoor pro & adv','Brooks','Eiger','Footstep','Gahalu','Hoka','Fixch','Ballerbro','Evil','Aerostreet','Portee',"Don's original",'Brisleblack','Barbatos','Piero','Erke','Topscore','Blibli','Guardbasket','Cartenz','Vionic Insole'];
const PLAT=[['YT','YouTube'],['IG','Instagram'],['TT','TikTok'],['FB','Facebook']];
const XCOL={cover:'COVER/THUMB'}; // kolom tambahan: key kalender -> header sheet
const EXTRA=['cover','akun','segmen','jamYT','jamIG','jamTT','jamFB','producer','writing','shooting','designer','editor','talent1','talent2','production','stYT','stIG','stTT','stFB','idYT','idIG','idTT','idFB','catatan','eventId'];
const ALLK=['id','date','title','type','brand',...EXTRA];
// daftar yang bisa ditambah + field yang memakainya
const LISTOF={akun:'akun',producer:'tim',designer:'tim',editor:'tim',talent1:'tim',talent2:'tim',stYT:'status',stIG:'status',stTT:'status',stFB:'status'};
const LISTNAME={akun:'Akun',segmen:'Segmen',tim:'Orang / Tim',status:'Status'};
const opts=l=>{const base=l==='tim'?OPT.tim:OPT[l]||[];const add=(state.options&&state.options[l])||[];return [...base,...add.filter(v=>!base.includes(v))]};
function addOption(list,value){
  value=String(value||'').trim();if(!value)return false;
  if(opts(list).some(v=>v.toLowerCase()===value.toLowerCase()))return true;
  state.options[list]=[...(state.options[list]||[]),value];lsSave();
  if(API){queue.push({op:'option',list,value});flush()}
  return true;
}
function mini(title,onOk){
  const w=document.createElement('div');w.className='back show';w.style.zIndex=60;
  w.innerHTML=`<div class="modal" style="max-width:360px"><h2>${esc(title)}</h2><input id="miniIn" autocomplete="off" placeholder="Ketik nama baru"><div class="err" id="miniErr"></div><div class="row"><span class="sp"></span><button id="miniNo">Batal</button><button class="primary" id="miniOk">Tambah</button></div></div>`;
  document.body.appendChild(w);
  const inp=w.querySelector('#miniIn'),done=()=>w.remove();
  const ok=()=>{const v=inp.value.trim();if(!v){w.querySelector('#miniErr').textContent='Isi dulu namanya.';return}onOk(v);done()};
  w.querySelector('#miniOk').onclick=ok;w.querySelector('#miniNo').onclick=()=>{onOk(null);done()};
  w.onclick=e=>{if(e.target===w){onOk(null);done()}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ok()}if(e.key==='Escape'){e.stopPropagation();onOk(null);done()}});
  setTimeout(()=>inp.focus(),30);
}
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];
const LS='sp-timeline-v1';

let state;
try{state=JSON.parse(document.getElementById('app-data').textContent)}catch(e){state={items:[]}}
if(!state||!Array.isArray(state.items))state={items:[]};
if(!state.brandColors||typeof state.brandColors!=='object')state.brandColors={};
if(!state.options||typeof state.options!=='object')state.options={};
let mode='brand';try{mode=localStorage.getItem('sp-timeline-mode')||'brand'}catch(e){}
const bkey=b=>b.trim().toLowerCase();
function brandColor(b){
  if(!b)return NOBRAND;
  const k=bkey(b);
  if(!state.brandColors[k]){
    const used=new Set(Object.values(state.brandColors));
    state.brandColors[k]=PALETTE.find(c=>!used.has(c))||PALETTE[Object.keys(state.brandColors).length%PALETTE.length];
  }
  return state.brandColors[k];
}
const textOn=c=>{const m=/^#([0-9a-f]{6})$/i.exec(c||'');if(!m)return '#fff';const n=parseInt(m[1],16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const L=.2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.45?'#111':'#fff'};
const colorOf=it=>mode==='brand'?brandColor(it.brand):(T[it.type]||TYPES[0]).color;

let artifact=null, canPublish=false;
const statusEl=()=>document.getElementById('status');
function setStatus(t){const s=statusEl();if(s)s.textContent=t}

// fallback: browser-only storage when the page can't save itself
// Outside Claude (e.g. GitHub Pages) the browser copy is the source of truth.
// Inside Claude the data embedded in the page wins (it syncs across devices).
const inClaude=!!(window.claude&&window.claude.use);
// ---- Google Sheet sync (GitHub Pages version)
const SHEET_API='';               // URL Web App Apps Script (…/exec)
const SHEET_URL='https://docs.google.com/spreadsheets/d/1SITTxYVeoH1cX9lG6EicitGIr5DBKwy7pStQu5KPFk4/edit';
let API='';try{API=localStorage.getItem('sp-timeline-api')||SHEET_API}catch(e){API=SHEET_API}
// one-time setup link: …/timeline-kalender/#api=<URL Web App>  → disimpan di browser, lalu dihapus dari alamat
if(location.hash.indexOf('#api=')===0){
  const v=decodeURIComponent(location.hash.slice(5));
  if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){API=v;try{localStorage.setItem('sp-timeline-api',v)}catch(e){}}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
}
if(inClaude)API='';
let synced=null, queue=[], busy=false, remoteOk=false;
const snap=st=>({items:Object.fromEntries(st.items.map(i=>[i.id,JSON.stringify(ALLK.map(k=>i[k]==null?'':String(i[k])))])),colors:{...st.brandColors}});
async function apiGet(){const r=await fetch(API,{cache:'no-store'});const d=await r.json();if(!d||!Array.isArray(d.items))throw new Error('bad');d.items=d.items.map(fromRemote);return d}
function toRemote(it){const o={...it,cols:{}};for(const k in XCOL){o.cols[XCOL[k]]=it[k]||'';delete o[k]}return o}
function fromRemote(it){const o={...it};for(const k in XCOL)o[k]=(it.cols&&it.cols[XCOL[k]])||'';delete o.cols;return o}
async function apiPost(op){if(op.op==='upsert')op={...op,item:toRemote(op.item)};if(op.op==='bulk')op={...op,items:op.items.map(toRemote)};const r=await fetch(API,{method:'POST',body:JSON.stringify(op)});const d=await r.json();if(!d.ok)throw new Error(d.error||'gagal');return d}
function diffOps(){
  const now=snap(state), ops=[];
  for(const it of state.items){if(synced.items[it.id]!==now.items[it.id])ops.push({op:'upsert',item:it})}
  for(const id in synced.items){if(!(id in now.items))ops.push({op:'delete',id})}
  for(const b in now.colors){if(synced.colors[b]!==now.colors[b])ops.push({op:'color',brand:b,color:now.colors[b]})}
  synced=now;return ops;
}
async function flush(){
  if(busy)return;busy=true;
  while(queue.length){
    setStatus('Menyimpan ke Sheet…');
    try{await apiPost(queue[0]);queue.shift()}
    catch(e){setStatus('Gagal simpan ke Sheet — dicoba lagi');busy=false;setTimeout(flush,8000);return}
  }
  busy=false;setStatus('Tersimpan di Sheet');
}
function syncRemote(){if(!API||!synced)return;queue.push(...diffOps());if(queue.length)flush()}
async function pull(force){
  if(!API)return;
  if(!force&&(busy||queue.length||back.classList.contains('show')||document.body.classList.contains('dragging')))return;
  try{
    const d=await apiGet();
    if(!d.brandColors)d.brandColors={};
    if(force&&!d.items.length&&state.items.length){ // first connect: move browser data into the empty sheet
      setStatus('Mindahin data browser ke Sheet…');
      const res=await apiPost({op:'bulk',items:state.items,brandColors:state.brandColors});
      Object.assign(d,res.data);d.items=d.items.map(fromRemote);
    }
    if(!d.options)d.options={};
    if(JSON.stringify({i:d.items,b:d.brandColors,o:d.options})!==JSON.stringify({i:state.items,b:state.brandColors,o:state.options})){state={items:d.items,brandColors:d.brandColors||{},options:d.options};lsSave();render()}
    synced=snap(state);remoteOk=true;setStatus('Tersambung ke Sheet');
  }catch(e){setStatus(synced?'Offline — pakai data terakhir':'Gagal nyambung ke Sheet (cek ⚙)')}
}
function lsLoad(){try{const v=localStorage.getItem(LS);if(v){const d=JSON.parse(v);if(d&&Array.isArray(d.items)&&(!inClaude||state.items.length===0)){state=d;if(!state.brandColors)state.brandColors={};if(!state.options)state.options={}}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}

const now=new Date();
let viewY=now.getFullYear(), viewM=now.getMonth();
const hidden=new Set();

const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);const h=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dt.getDay()];return `${h}, ${d} ${BULAN[m-1]} ${y}`}

function renderFilters(){
  const prefix=`${viewY}-${pad(viewM+1)}`;
  const inMonth=state.items.filter(i=>i.date.startsWith(prefix));
  const f=document.getElementById('filters');
  f.innerHTML=`<span class="mode"><span data-m="brand" class="${mode==='brand'?'on':''}">Warna: Brand</span><span data-m="type" class="${mode==='type'?'on':''}">Warna: Jenis</span></span>`+TYPES.map(t=>`<span class="chip-f ${hidden.has(t.id)?'off':''}" data-t="${t.id}"><span class="dot" style="background:${t.color}"></span>${t.name} <span class="count">${inMonth.filter(i=>i.type===t.id).length}</span></span>`).join('')
   +`<span class="status" id="status">${canPublish?'Tersimpan':API?(remoteOk?'Tersambung ke Sheet':'Nyambung ke Sheet…'):(inClaude?'Mode lokal (cuma di browser ini)':'Belum nyambung ke Sheet — klik ⚙')}</span>`;
  f.querySelectorAll('.chip-f').forEach(el=>el.onclick=()=>{const t=el.dataset.t;hidden.has(t)?hidden.delete(t):hidden.add(t);render()});
  f.querySelectorAll('.mode span').forEach(el=>el.onclick=()=>{mode=el.dataset.m;try{localStorage.setItem('sp-timeline-mode',mode)}catch(e){};render()});
  const bb=document.getElementById('brandBar');
  if(mode!=='brand'){bb.innerHTML='';bb.style.display='none';return}
  bb.style.display='';
  const names={};inMonth.forEach(i=>{if(i.brand){const k=bkey(i.brand);names[k]=names[k]||{name:i.brand,n:0};names[k].n++}});
  const noB=inMonth.filter(i=>!i.brand).length;
  bb.innerHTML=`<h4>Brand Tap In</h4><div class="sub2">${BULAN[viewM]} ${viewY} · klik buat ganti warna</div>`
    +Object.values(names).sort((a,b)=>b.n-a.n).map(o=>`<div class="bi brand" data-b="${esc(o.name)}" title="Ganti warna ${esc(o.name)}"><span class="dot" style="background:${brandColor(o.name)}"></span><span class="nm">${esc(o.name)}</span><span class="count">${o.n}</span><span class="ed">✎</span></div>`).join('')
    +(noB?`<div class="bi"><span class="dot" style="background:${NOBRAND}"></span><span class="nm">Non brand</span><span class="count">${noB}</span><span class="ed" style="visibility:hidden">✎</span></div>`:'')
    +(!inMonth.length?'<div class="none">Belum ada konten bulan ini</div>':'');
  bb.querySelectorAll('.bi.brand').forEach(el=>el.onclick=()=>openBrandColor(el.dataset.b));
}

function render(){
  document.getElementById('monthLbl').textContent=`${BULAN[viewM]} ${viewY}`;
  renderFilters();
  const g=document.getElementById('grid');
  let html=HARI.map(h=>`<div class="dow">${h}</div>`).join('');
  const first=new Date(viewY,viewM,1);
  const offset=(first.getDay()+6)%7; // Monday first
  const start=new Date(viewY,viewM,1-offset);
  const weeks=Math.ceil((offset+new Date(viewY,viewM+1,0).getDate())/7);
  const mobile=matchMedia('(max-width:640px)').matches;
  const max=Infinity;
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=key(d.getFullYear(),d.getMonth(),d.getDate());
    const items=byDate(k).filter(it=>!hidden.has(it.type));
    const cls=['day'];if(d.getMonth()!==viewM)cls.push('out');if(k===todayKey)cls.push('today');
    html+=`<div class="${cls.join(' ')}" data-k="${k}"><div class="num"><span>${d.getDate()}</span><span class="add">+</span></div>`
      +items.slice(0,max).map(it=>`<div class="item" data-id="${it.id}" style="background:${colorOf(it)};color:${textOn(colorOf(it))}" title="${(T[it.type]||TYPES[0]).name} · ${esc(it.title)}${it.brand?' — '+esc(it.brand):''}">${mode==='brand'?`<span class="tg">${TAG[it.type]||''}</span>`:''}${it.production==='✅'?'✓ ':''}${esc(it.title)}${it.brand&&mode!=='brand'?` <span class="b">· ${esc(it.brand)}</span>`:''}</div>`).join('')
      +(items.length>max?`<div class="more">+${items.length-max} lagi</div>`:'')
      +`</div>`;
  }
  g.innerHTML=html;
  g.querySelectorAll('.item').forEach(attachDrag);
  g.querySelectorAll('.day').forEach(el=>el.onclick=e=>{
    if(justDragged)return;
    const it=e.target.closest('.item');
    if(it&&!mobile){openForm(state.items.find(x=>x.id===it.dataset.id));return}
    const k=el.dataset.k;
    byDate(k).length?openDay(k):openForm(null,k);
  });
}

// ---- drag & drop (mouse: drag; touch: hold ~0.3s then drag)
let justDragged=false;
function attachDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const id=el.dataset.id, sx=e.clientX, sy=e.clientY, touch=e.pointerType!=='mouse';
    let active=false, ghost=null, over=null, holdT=null, cancelled=false;
    const begin=()=>{
      active=true;
      ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=Math.max(el.offsetWidth,140)+'px';
      document.body.appendChild(ghost);document.body.classList.add('dragging');el.classList.add('src');
      if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
      move(lastX,lastY);
    };
    let lastX=sx,lastY=sy;
    const move=(x,y)=>{
      ghost.style.left=(x-20)+'px';ghost.style.top=(y-14)+'px';
      const t=document.elementFromPoint(x,y);const d=t&&t.closest('.day');
      if(d!==over){if(over)over.classList.remove('drop');over=d;if(over)over.classList.add('drop')}
    };
    if(touch)holdT=setTimeout(()=>{if(!cancelled)begin()},300);
    const onMove=ev=>{
      lastX=ev.clientX;lastY=ev.clientY;
      if(!active){
        const dist=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(touch){if(dist>8){cancelled=true;clearTimeout(holdT)}return}
        if(dist>5)begin();else return;
      }
      ev.preventDefault();move(ev.clientX,ev.clientY);
    };
    const onUp=()=>{
      clearTimeout(holdT);
      removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
      if(!active)return;
      document.body.classList.remove('dragging');ghost.remove();el.classList.remove('src');
      if(over)over.classList.remove('drop');
      justDragged=true;setTimeout(()=>justDragged=false,50);
      const it=state.items.find(x=>x.id===id);
      if(over&&it&&over.dataset.k!==it.date){
        const from=it.date;it.date=over.dataset.k;
        state.items.sort((a,b)=>a.date.localeCompare(b.date));
        save();render();
        toast(`Dipindah ke ${fmtDate(it.date)}`,()=>{it.date=from;state.items.sort((a,b)=>a.date.localeCompare(b.date));save();render()});
      }
    };
    addEventListener('pointermove',onMove,{passive:false});addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
let toastEl=null,toastT=null;
function toast(msg,undo){
  if(toastEl)toastEl.remove();clearTimeout(toastT);
  toastEl=document.createElement('div');toastEl.className='toast';
  toastEl.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Batalin</button>':''}`;
  document.body.appendChild(toastEl);
  if(undo)toastEl.querySelector('button').onclick=()=>{undo();toastEl.remove();toastEl=null};
  toastT=setTimeout(()=>{if(toastEl){toastEl.remove();toastEl=null}},4000);
}

const normHex=v=>{v=String(v||'').trim().replace(/^#?/,'#');if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v.slice(1).split('').map(x=>x+x).join('');return /^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null};
// pilihan warna: palet + warna custom yang sudah dipakai + color picker & kolom hex
function mountSwatches(box,sel,onPick){
  sel=normHex(sel)||PALETTE[0];
  const used=[...new Set(Object.values(state.brandColors).map(normHex).filter(c=>c&&!PALETTE.includes(c)))];
  const all=[...PALETTE,...used];if(!all.includes(sel))all.push(sel);
  box.innerHTML=`<div class="sw">${all.map(c=>`<i data-c="${c}" title="${c.toUpperCase()}" style="background:${c}"></i>`).join('')}</div>
    <div class="swc"><input type="color" aria-label="Pilih warna custom"><input class="hex" maxlength="7" placeholder="#RRGGBB" aria-label="Kode hex"><span>warna custom / hex</span></div>`;
  const pick=box.querySelector('input[type=color]'),hex=box.querySelector('.hex');
  const show=c=>{box.querySelectorAll('.sw i').forEach(i=>i.classList.toggle('on',i.dataset.c===c));pick.value=c;if(document.activeElement!==hex){hex.value=c.toUpperCase()};hex.classList.remove('bad')};
  // pilih warna: cuma ganti pilihan, palet tidak ditambah (warna custom baru muncul di palet setelah disimpan ke brand)
  const set=c=>{c=normHex(c);if(!c)return;show(c);onPick(c)};
  box.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>set(i.dataset.c));
  pick.addEventListener('input',()=>set(pick.value));
  hex.addEventListener('input',()=>{const c=normHex(hex.value);hex.classList.toggle('bad',!!hex.value&&!c&&hex.value.replace('#','').length>=6);if(c&&hex.value.replace('#','').length===6)set(c)});
  hex.addEventListener('blur',()=>{const c=normHex(hex.value);if(c)set(c);else show(normHex(pick.value))});
  show(sel);
}

}

    e.preventDefault();

    const date=modal.querySelector('#fDate').value;
    if(!title){modal.querySelector('#fErr').textContent='Judul konten wajib diisi.';return}

    state.items.sort((a,b)=>a.date.localeCompare(b.date));
    save();close();render();
  };
  back.classList.add('show');
  setTimeout(()=>modal.querySelector('#fTitle').focus(),50);
}

// saving: publish a new version of this page with the data embedded
let timer=null;
function buildDoc(){
  const css=document.getElementById('app-css').textContent;
  const js=document.getElementById('app-js').textContent;
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const head='\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Timeline Produksi Konten — Shoe Police</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">\n';
  return '<!DOCTYPE html>\n<html lang="id">\n<head>'+head+'<style id="app-css">'+css+'</style>\n</head>\n<body>'
    +cleanBody()
    +'<script type="application/json" id="app-data">'+json+'</'+'script>\n<script id="app-js">'+js+'</'+'script>\n</body>\n</html>\n';
}
function cleanBody(){
  // static shell only — never the rendered calendar
  return `

</div>

<div class="back" id="back">

`;

function save(){
  lsSave();
  if(API){syncRemote();return}
  if(!canPublish){setStatus('Mode lokal (cuma di browser ini)');return}
  setStatus('Menyimpan…');
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{await artifact.publish(buildDoc());setStatus('Tersimpan')}
    catch(e){
      const c=e&&(e.code||e.name||e.message)||'';
      if(String(c).includes('conflict'))setStatus('Ada perubahan dari device lain, memuat ulang…');
      else if(/not_granted|not_writer/.test(String(c))){canPublish=false;setStatus('Mode lihat saja')}
      else setStatus('Gagal simpan — coba lagi');
    }
  },700);
}

  modal.classList.remove('wide');
  modal.innerHTML=`<h2>Google Sheet</h2><div class="sub">Tempel URL Web App dari Apps Script (berakhiran <b>/exec</b>) biar data sinkron di semua device.</div>
   <label for="apiIn">URL Web App</label><input id="apiIn" value="${esc(API)}" placeholder="https://script.google.com/macros/s/…/exec">
   <div class="err" id="apiErr"></div>
   <div class="sub" style="margin-top:10px"><a href="${SHEET_URL}" target="_blank" rel="noopener">Buka Google Sheet-nya ↗</a></div>
   <div class="row"><span class="sp"></span><button id="cl">Batal</button><button class="primary" id="ok">Sambungkan</button></div>`;
  modal.querySelector('#cl').onclick=close;
  modal.querySelector('#ok').onclick=async()=>{
    const v=modal.querySelector('#apiIn').value.trim();const err=modal.querySelector('#apiErr');
    if(v&&!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(v)){err.textContent='URL-nya harus dari script.google.com';return}
    try{localStorage.setItem('sp-timeline-api',v)}catch(e){}
    API=v;synced=null;remoteOk=false;close();render();
    if(API)await pull(true);
  };
  back.classList.add('show');
}
document.getElementById('sheetBtn').onclick=openSheet;
if(inClaude)document.getElementById('sheetBtn').style.display='none';

lsLoad();
render();
if(API)pull(true);
setInterval(()=>pull(false),30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(false)});
if(window.claude&&claude.use){
  claude.use('artifact').then(a=>{if(a){artifact=a;canPublish=true;renderFilters()}}).catch(()=>{});
}
})();
</script>
</body>
</html>
